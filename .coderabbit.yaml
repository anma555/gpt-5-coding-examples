# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit の設定ファイル(PR の自動レビュー用)
language: ja-JP

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  # レビュー対象から外すファイル
  path_filters:
    # dev / build 時に apps/ からコピーされる生成物
    - "!front-end/public/**"
    # ビルド済みの Next.js 静的エクスポート
    - "!apps/**/_next/**"
    - "!front-end/package-lock.json"

  # CLAUDE.md の「守ってほしいこと」に合わせたレビュー指示
  path_instructions:
    - path: "**/*.{ts,tsx,js,mjs,html}"
      instructions: |
        - ソースコード内のコメントは日本語で記述されているか確認すること。
        - TypeScript では必要以上にクラスを使っていないか確認すること(関数とプレーンなオブジェクトを基本とする)。
        - 既存のディレクトリ構成・命名・状態管理の流儀にそろっているか確認すること。
    - path: "examples/*.yaml"
      instructions: |
        - title と prompt が必須(どちらかが欠けるとギャラリーに表示されない)。
        - ファイル名(スラッグ)に対応する apps/<slug>/index.html が存在するか確認すること。
        - CDN にポスター画像がない新規サンプルでは poster フィールドが必要。
